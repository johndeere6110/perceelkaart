<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perceelkaart</title>
<meta name="theme-color" content="#2F5A2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perceelkaart">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Lettertypen staan in de app zelf (Barlow, SIL OFL; zie fonts/OFL.txt): geen verzoeken naar Google */
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2"); }
/* Zelfde kleuren en stijl als de Zaaihulp */
:root {
  --bg: #E9EDE6; --surface: #F8FAF6; --ink: #1C2318; --muted: #5B6653; --line: #C9D1C2;
  --accent: #2F5A2B; --accent-ink: #F3F7EF; --warn: #A3401F; --hl: #E8B400;
  color-scheme: light; box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141912; --surface: #1D241A; --ink: #E6ECE0; --muted: #9BA892; --line: #34402F;
    --accent: #8DBA6A; --accent-ink: #12180F; --warn: #F08A5F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141912; --surface: #1D241A; --ink: #E6ECE0; --muted: #9BA892; --line: #34402F;
  --accent: #8DBA6A; --accent-ink: #12180F; --warn: #F08A5F; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
}
.num { font-family: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; }
header h1 { margin: 0; font: 700 22px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; }
header .tag { font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
#map { flex: 1; min-height: 45vh; background: var(--line); }
.leaflet-container { font: inherit; }
.panel { background: var(--bg); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 640px; width: 100%; margin: 0 auto; }
.row { display: flex; gap: 10px; }
.btn { flex: 1; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 17px "Barlow", system-ui, sans-serif; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { font-size: 15px; color: var(--muted); margin-top: 8px; min-height: 1.4em; }
.hint.warn { color: var(--warn); font-weight: 600; }
.advice { margin-top: 10px; background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.advice .adv-main { font-size: 36px; line-height: 1.1; }
.advice .meta { color: var(--muted); }
details { margin-top: 10px; font-size: 14px; color: var(--muted); }
details pre { white-space: pre-wrap; word-break: break-all; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--ink); font: 12px ui-monospace, Menlo, Consolas, monospace; max-height: 220px; overflow: auto; }
.tot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tot .adv-main { font-size: 40px; white-space: nowrap; }
.log { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 30px 1fr auto 44px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log .nr { font-size: 18px; color: var(--muted); text-align: center; }
.log .go { border: 0; background: none; color: inherit; text-align: left; padding: 0; font: inherit; min-width: 0; }
.log .name { font-weight: 500; overflow-wrap: anywhere; }
.log .meta { font-size: 14px; color: var(--muted); }
.log .w { font-size: 21px; }
.del { border: 0; background: none; color: var(--muted); font-size: 24px; width: 44px; height: 44px; border-radius: 8px; }
.armed { color: var(--warn) !important; font-weight: 700 !important; }
.leaflet-tooltip.pnr { background: var(--hl); border: 0; color: #1C2318; font: 700 15px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; padding: 1px 7px; border-radius: 999px; box-shadow: none; }
.leaflet-tooltip.pnr::before { display: none; }
.lbl2 { margin-top: 10px; color: var(--muted); font-weight: 500; }
.seg4 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); margin-top: 6px; }
.seg4 button { border: 0; background: transparent; color: var(--ink); padding: 6px 2px 8px; min-height: 64px; font: 700 20px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seg4 button small { font: 500 12px "Barlow", system-ui, sans-serif; color: var(--muted); line-height: 1.1; text-align: center; }
.seg4 button i { display: block; width: 70%; height: 0; border-top: 5px solid; margin-top: 3px; }
.seg4 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg4 button[aria-pressed="true"] small { color: var(--accent-ink); }
.warn4 { color: var(--warn); font-weight: 600; }
.af { color: var(--ink); font-weight: 600; margin-top: 2px; }
.log .detail { grid-column: 2 / -1; font-size: 14px; color: var(--muted); margin-top: -2px; }
.btab { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.btab th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 0 6px 2px 0; }
.btab td { padding: 3px 6px 3px 0; color: var(--muted); }
.btab td.r, .btab th.r { text-align: right; }
.btab tr.telt td { color: var(--ink); font-weight: 600; }
.btab tr.telt td:last-child { color: var(--accent); }
.spuit { display: grid; grid-template-columns: 1fr 84px auto; gap: 10px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.spuit label { color: var(--muted); font-weight: 500; }
.spuit input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 22px; text-align: right; padding: 0 10px; outline: none; }
.spuit input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.spuit .btn { min-height: 48px; padding: 0 14px; flex: none; }
.spuit .ronde { grid-column: 1 / -1; }
.spuit [hidden] { display: none; }
.spuit .spoorKeus { display: flex; gap: 4px; }
.spuit .spoorKeus .btn { min-height: 48px; padding: 0 8px; }
.sp .zaai { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.sp .zaai .btab td:nth-child(5) { font-weight: 600; color: var(--ink); }
.sp .zaai .btab tr.buiten td { color: var(--warn); }
.sp .zaai .kort { display: grid; gap: 4px; margin: 4px 0 6px; font-size: 17px; color: var(--ink); }
.sp .zaai .kort div { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; align-items: baseline; }
.sp .zaai .kort span { color: var(--muted); font-size: 14px; }
.sp .zaai .zdet summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.sp .zaai .zdet > div { margin-top: 4px; }
.sp .zaai .knoppen { display: flex; flex-wrap: wrap; gap: 6px; }
.zl { background: #f2c200; color: #1C2318; font: 700 15px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; border-radius: 6px; padding: 1px 6px; white-space: nowrap; transform: translate(-50%, -50%); display: inline-block; box-shadow: 0 0 0 2px #1C2318; }
.zl.st { background: #e8590c; color: #fff; font-size: 17px; }
.zl.rd { background: #9c36b5; color: #fff; }
.zpijl { color: #fff; font-size: 24px; line-height: 28px; text-align: center; text-shadow: 0 0 3px #000, 0 0 3px #000; }
.zpijl.st { color: #ffd8a8; font-size: 30px; }
.sp .zaai .start { margin: 6px 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--bg); color: var(--ink); }
.kavel { margin-top: 10px; border: 2px solid #e8590c; border-radius: 10px; padding: 10px 12px; }
.kavel .kop { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; }
.kavel .naam { font-weight: 600; }
.kavel .w { font-size: 21px; }
.kavel .meta { font-size: 14px; color: var(--muted); }
.kavel .klein { min-height: 40px; font-size: 15px; margin-top: 6px; width: auto; padding: 0 12px; display: inline-flex; }
.leaflet-tooltip.kav { background: #e8590c; color: #fff; }
#bBron[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#bKoppel[aria-pressed="true"] { background: #e8590c; border-color: #e8590c; color: #fff; }
.spuit .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sp { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.sp strong { color: var(--ink); font-weight: 600; }
.sp .ab { margin-top: 4px; font-variant-numeric: tabular-nums; }
.sp .klein { min-height: 40px; font-size: 15px; margin-top: 6px; width: auto; padding: 0 12px; display: inline-flex; }
.spnr { background: #1C2318; color: #fff; font: 700 13px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; border-radius: 999px; padding: 0 6px; line-height: 18px; text-align: center; white-space: nowrap; }
.spijl { color: #fff; font-size: 18px; line-height: 20px; text-align: center; text-shadow: 0 0 3px #000; }
.abl { background: #fff; color: #1C2318; font: 700 13px "Barlow", system-ui, sans-serif; border: 2px solid #1C2318; border-radius: 4px; text-align: center; line-height: 16px; }
.toggle { width: 100%; margin-top: 10px; flex: none; }
#map.oever { cursor: crosshair; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #3a6fd1; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header>
  <h1>Perceelkaart</h1><span class="tag">versie 31</span>
</header>
<div id="map" role="application" aria-label="Kaart, tik op een perceel"></div>
<div class="panel">
  <div class="row">
    <button type="button" class="btn" id="bLaag" aria-pressed="false">Luchtfoto</button>
    <button type="button" class="btn" id="bMij">Mijn locatie</button>
    <button type="button" class="btn" id="bNL">Nederland</button>
  </div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn" id="bBron" aria-pressed="false">Grenzen: BRP-gewasperceel</button></div>
  <div class="hint" id="hint">Tik op een perceel om het toe te voegen. Nog eens tikken haalt het weg.</div>
  <div class="advice" id="info" aria-live="polite" hidden>
    <div class="tot"><span id="totLbl"></span><span class="adv-main num" id="totHa"></span></div>
    <div class="meta" id="totSub"></div>
    <div class="row" style="margin-top:10px">
      <button type="button" class="btn" id="bWater">Water zoeken</button>
      <button type="button" class="btn" id="bOever" aria-pressed="false">Oevers aanwijzen</button>
    </div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn" id="bKoppel" aria-pressed="false">Percelen koppelen</button></div>
    <div id="typeBox" hidden>
      <div class="lbl2">Type waterloop, kies vóór het tikken</div>
      <div class="seg4" role="group" aria-label="Type waterloop" id="typeSeg"></div>
    </div>
    <div class="spuit">
      <label for="spuitB">Spuitbreedte (m)</label>
      <input id="spuitB" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="27">
      <button type="button" class="btn" id="bSpuit" aria-pressed="false">Sporen</button>
      <label for="sectieB">Sectiebreedte (m)</label>
      <input id="sectieB" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="3">
      <span></span>
      <label for="zaaiB">Zaaibreedte (m)</label>
      <input id="zaaiB" class="num" type="text" inputmode="decimal" autocomplete="off" placeholder="uit">
      <span></span>
      <label for="rijB" class="zx">Rijafstand (cm)</label>
      <input id="rijB" class="num zx" type="text" inputmode="decimal" autocomplete="off" placeholder="37,5">
      <span class="zx"></span>
      <label for="rondeB" class="zx">Zaairondes eromheen</label>
      <input id="rondeB" class="num zx" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      <button type="button" class="btn klein zx" id="bKlok">tegen de klok</button>
      <label for="spoorB" class="zx">Spoorbreedte spuit (m)</label>
      <input id="spoorB" class="num zx" type="text" inputmode="decimal" autocomplete="off" placeholder="1,8">
      <span class="zx spoorKeus"><button type="button" class="btn klein" data-spoor="1,5">1,50</button><button type="button" class="btn klein" data-spoor="1,8">1,80</button></span>
      <label for="bandB" class="zx">Bandbreedte (cm)</label>
      <input id="bandB" class="num zx" type="text" inputmode="decimal" autocomplete="off" placeholder="40">
      <span class="zx"></span>
      <button type="button" class="btn ronde" id="bRonde" aria-pressed="true">Buitenronde eerst: aan</button>
      <button type="button" class="btn ronde" id="bAB" aria-pressed="false">AB-kant kiezen</button>
      <button type="button" class="btn ronde" id="bPijl" aria-pressed="false">Pijlen: uit</button>
    </div>
    <div id="kavelBox"></div>
    <ul class="log" id="lijst"></ul>
    <div class="row" style="margin-top:10px"><button type="button" class="btn" id="bWis">Alles wissen</button></div>
  </div>
  <details>
    <summary>Ruwe data (voor het testen)</summary>
    <pre id="ruw">Nog niks opgehaald.</pre>
  </details>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/polygon-clipping/polygon-clipping.umd.min.js"></script>
<script src="perceel.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const hint = $("hint"), info = $("info"), ruw = $("ruw");
  const say = (t, warn) => { hint.textContent = t; hint.className = "hint" + (warn ? " warn" : ""); };
  const parse = v => { const n = parseFloat(String(v || "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
  const mTxt = v => Math.round(v).toLocaleString("nl-NL") + " m";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const haTxt = v => v.toLocaleString("nl-NL", { minimumFractionDigits: 3, maximumFractionDigits: 3, useGrouping: false });
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  if (!window.L) { say("Kaart kon niet laden. Heb je internet?", true); return; }
  if (!window.Perceel) { say("perceel.js kon niet laden.", true); return; }

  // Laatste kaartbeeld onthouden; eerste keer heel Nederland
  // PDOK-kaarten dekken alleen Nederland: kaart daarbinnen houden, anders zie je niks
  const NL = L.latLngBounds([50.6, 3.1], [53.7, 7.4]);
  const inNL = (lat, lon) => NL.contains([lat, lon]);
  let view = store.get("kaartTestView", null);
  if (!view || !inNL(view.lat, view.lon) || !(view.z >= 7)) view = { lat: 52.15, lon: 5.4, z: 8 };
  const map = L.map("map", { zoomControl: true, attributionControl: true, minZoom: 7, maxBounds: NL.pad(0.05), maxBoundsViscosity: 1 })
    .setView([view.lat, view.lon], view.z);
  store.set("kaartTestView", view);
  $("bNL").addEventListener("click", () => map.fitBounds(NL));
  map.on("moveend", () => { const c = map.getCenter(); store.set("kaartTestView", { lat: c.lat, lon: c.lng, z: map.getZoom() }); });

  // PDOK-achtergronden (Web Mercator, geen key)
  const attr = 'Kaart: <a href="https://www.pdok.nl">PDOK</a>, Kadaster';
  const brt = L.tileLayer("https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png", { minZoom: 7, maxZoom: 19, attribution: attr });
  const foto = L.tileLayer("https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg", { minZoom: 7, maxZoom: 19, attribution: "Luchtfoto: " + attr });
  let isFoto = store.get("kaartTestFoto", false);
  const setLaag = () => {
    (isFoto ? brt : foto).remove(); (isFoto ? foto : brt).addTo(map);
    $("bLaag").setAttribute("aria-pressed", isFoto); store.set("kaartTestFoto", isFoto);
  };
  $("bLaag").addEventListener("click", () => { isFoto = !isFoto; setLaag(); });
  setLaag();

  // Bevestigen zonder pop-up, zoals in de app: eerste tik vraagt "zeker?", tweede tik voert uit
  function armed(btn, label) {
    if (btn.dataset.armed === "1") { clearTimeout(btn._t); btn.dataset.armed = ""; btn.classList.remove("armed"); btn.textContent = btn._old; return true; }
    btn.dataset.armed = "1"; btn._old = btn.textContent; btn.textContent = label; btn.classList.add("armed");
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.dataset.armed = ""; btn.classList.remove("armed"); btn.textContent = btn._old; }, 3000);
    return false;
  }

  let punt = null, mij = null, bezig = 0;
  const stijl = () => ({ color: getComputedStyle(document.documentElement).getPropertyValue("--hl").trim() || "#E8B400", weight: 3, fillOpacity: .2 });
  // Bron van de perceelgrenzen: BRP-gewasperceel (ingetekend) of referentieperceel (RVO, uit de BGT)
  let bronRef = store.get("kaartBronRef", false);
  const zetBron = () => {
    $("bBron").setAttribute("aria-pressed", bronRef);
    $("bBron").textContent = "Grenzen: " + (bronRef ? "referentieperceel (BGT)" : "BRP-gewasperceel");
  };
  // Omzetten: nieuwe percelen uit de gekozen bron, en de gekozen percelen gaan mee (de andere grens blijft bewaard)
  $("bBron").addEventListener("click", async () => {
    bronRef = !bronRef; store.set("kaartBronRef", bronRef); zetBron();
    const uitleg = bronRef ? "Nieuwe percelen komen uit de referentiepercelen: de kavel volgens de topografische kaart, meestal tot de slootkant." : "Nieuwe percelen komen uit het BRP: het ingetekende gewasperceel.";
    const om = sel.filter(q => q.ref !== bronRef);
    if (!om.length) { say(uitleg); return; }
    const naam = bronRef ? "referentieperceel" : "BRP-perceel", doel = bronRef;
    say("Percelen omzetten naar " + naam + "…");
    const mis = []; let n = 0;
    for (const q of om) {
      altGeprobeerd.delete(q.key);
      await haalAlt(q);
      if (bronRef !== doel) return; // intussen weer teruggezet
      const nr = sel.indexOf(q) + 1;
      if (!nr || q.ref === doel) continue;
      const r = wissel(q);
      if (r === true) n++;
      else mis.push("perceel " + nr + (r === "dubbel" ? " heeft hetzelfde " + naam + " als een ander perceel" : q.alt && q.alt.geen ? ": geen " + naam + " op deze plek" : ": niet opgehaald (geen verbinding?)"));
    }
    bewaar(); teken();
    say((n ? n + (n === 1 ? " perceel" : " percelen") + " omgezet naar " + naam + ". " : "") + (mis.length ? "Niet omgezet: " + mis.join("; ") + ". " : "") + uitleg, mis.length > 0);
  });
  zetBron();
  const sleutel = p => (p.ref ? "ref:" : "") + (p.id != null ? "id:" + p.id : "g:" + JSON.stringify(p.geometry.coordinates).slice(0, 120));

  // Selectie: meerdere percelen bij elkaar opgeteld, wordt onthouden
  let sel = store.get("kaartTestSelectie", []);
  if (!Array.isArray(sel)) sel = [];
  sel = sel.filter(q => q && q.geometry && typeof q.ha === "number");

      go.append(nm, mt);
      go.addEventListener("click", () => map.fitBounds(L.geoJSON(q.geometry).getBounds(), { padding: [24, 24], maxZoom: 17 }));
      const w = document.createElement("div"); w.className = "w num"; w.textContent = haTxt(q.ha) + " ha";
      const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "×";
      del.setAttribute("aria-label", "Haal perceel " + (i + 1) + " weg");
      del.addEventListener("click", () => { sel.splice(i, 1); bewaar(); teken(); });
      li.append(nr, go, w, del); if (detail) li.appendChild(detail); ul.appendChild(li);
    });
    const kb = $("kavelBox"); kb.innerHTML = "";
    kavels.forEach(kv => {
      const vorm = kavelVorm(kv), leden = kv.leden.map(k => sel.find(q => q.key === k));
      if (vorm) {
        const g = L.geoJSON(vorm, { style: { color: "#e8590c", weight: 4, fill: false }, interactive: false });
        g.bindTooltip(kv.naam, { permanent: true, direction: "top", className: "pnr kav" });
        laag.addLayer(g);
      }
      const box = document.createElement("div"); box.className = "kavel";
      const kop = document.createElement("div"); kop.className = "kop";
      const nm = document.createElement("div");
      const n1 = document.createElement("div"); n1.className = "naam"; n1.textContent = kv.naam;
      const n2 = document.createElement("div"); n2.className = "meta"; n2.textContent = "perceel " + leden.map(q => sel.indexOf(q) + 1).join(" + ");
      nm.append(n1, n2);
      const w = document.createElement("div"); w.className = "w num"; w.textContent = haTxt(leden.reduce((t, q) => t + q.ha, 0)) + " ha";
      kop.append(nm, w); box.appendChild(kop);
      // Pad of naad tussen de percelen: zit in de vorm voor de sporen, niet in de ha
      if (vorm) {
        const pad = (Perceel.oppervlakteM2(vorm) - leden.reduce((t, q) => t + Perceel.oppervlakteM2(q.geometry), 0));
        if (pad >= 20) { const x = document.createElement("div"); x.className = "meta"; x.textContent = "Pad of naad ertussen: ca. " + m2Txt(Math.round(pad / 10) * 10) + ", telt niet mee in de ha."; box.appendChild(x); }
      }
      if (!vorm) { const x = document.createElement("div"); x.className = "warn4"; x.textContent = "Deze percelen liggen niet tegen elkaar aan."; box.appendChild(x); }
      if (spuitAan && sb && vorm) { const d = spuitBlok(vorm, kv, bewaarK, sb); if (d) box.appendChild(d); }
      const los = document.createElement("button"); los.type = "button"; los.className = "btn klein"; los.textContent = "Ontkoppelen";
      los.addEventListener("click", () => { if (!armed(los, "Tik nog eens")) return; kavels = kavels.filter(k => k !== kv); bewaarK(); teken(); });
      box.appendChild(los);
      kb.appendChild(box);
    });
    const bfs = sel.map(buffer), tot = sel.reduce((a, q) => a + q.ha, 0), dubbel = sel.some(q => binnenAnder(q) >= 0);
    const af = bfs.reduce((a, x) => a + x.af, 0), om = bfs.reduce((a, x) => a + x.lengte, 0);
    $("totLbl").textContent = (sel.length === 1 ? "1 perceel" : sel.length + " percelen samen") + (af ? ", zonder bufferstrook" : "");
    $("totHa").textContent = haTxt(tot - af) + " ha";
    $("totSub").textContent = (dubbel ? "Let op: percelen overlappen, het totaal telt dubbel. " : "") + (af ? "Bruto " + haTxt(tot) + " ha − bufferstroken " + haTxt(af) + " ha (" + mTxt(om) + " oever)"
      : om ? mTxt(om) + " oever, alleen droge sloten: geen bufferstrook." : "");
    $("info").hidden = !sel.length;
    if (!sel.length && oeverModus) setOever(false);
    map.invalidateSize();
  }
  $("bWis").addEventListener("click", e => { if (armed(e.currentTarget, "Tik nog eens om te wissen")) { sel = []; kavels = []; bewaar(); bewaarK(); setOever(false); setKoppel(false); setAB(false); teken(); say("Selectie gewist. Tik op een perceel om te beginnen."); } });

  async function zoek(lat, lon) {
    if (map.getZoom() < 14) { map.setView([lat, lon], 16); say("Ingezoomd. Tik nog eens op het perceel."); return; }
    // Tik in een perceel dat al gekozen is: weghalen, zonder internet
    const al = sel.findIndex(q => Perceel.bevatPunt(q.geometry, lon, lat));
    if (al >= 0) {
      const weg = sel.splice(al, 1)[0]; bewaar(); teken();
      say((weg.gewas || "Perceel") + " (" + haTxt(weg.ha) + " ha) weggehaald.");
      return;
    }
    const nr = ++bezig;
    if (punt) punt.remove();
    punt = L.circleMarker([lat, lon], { radius: 5, color: "#fff", weight: 2, fillColor: "#1C2318", fillOpacity: 1 }).addTo(map);
    say("Perceel ophalen…");
    try {
      const r = await Perceel.zoekOpPunt(lon, lat, bronRef ? { api: Perceel.API_REF, cacheKey: "perceelCacheRef" } : undefined);
      r.perceel.ref = bronRef;
      if (nr !== bezig) return; // er is intussen ergens anders getikt
      const p = r.perceel, key = sleutel(p);
      if (punt) { punt.remove(); punt = null; }
      if (!sel.some(q => q.key === key)) {
        sel.push({ key, gewas: p.gewas || (p.ref ? "Referentieperceel" : ""), jaar: p.jaar, status: p.status || "", ha: p.ha, bron: p.bron, ref: !!p.ref, geometry: p.geometry, oever: {} });
        bewaar(); teken();
      }
      say((p.gewas || "Perceel") + " (" + haTxt(p.ha) + " ha) toegevoegd." + (p.bron === "opgeslagen" ? " Geen verbinding: uit opgeslagen percelen." : ""), p.bron === "opgeslagen");
      ruw.textContent = JSON.stringify({ punt: [+lon.toFixed(6), +lat.toFixed(6)], bron: p.bron, id: p.id, properties: p.eigenschappen,
        geometrie: p.geometry.type + ", " + (p.geometry.type === "Polygon" ? p.geometry.coordinates[0].length : "?") + " punten",
        opgeslagen: Perceel.aantalOpgeslagen() + (Perceel.aantalOpgeslagen() === 1 ? " perceel" : " percelen") }, null, 2);
    } catch (e) {
      if (nr !== bezig) return;
      say(e && e.code === "geen-perceel" ? "Hier ligt geen landbouwperceel" + (bronRef ? "" : " in de BRP") + ". Tik binnen een perceel." : (e && e.message) || "Ophalen lukte niet.", true);
      ruw.textContent = "Fout: " + (e && e.code ? e.code + " – " : "") + (e && e.message);
    }
  }
  // Oevers aanwijzen: tik bij de rand, het hele rechte stuk gaat aan of uit
  function oeverTik(ll) {
    const p = map.latLngToContainerPoint(ll);
    let best = null;
    sel.forEach(q => Perceel.zijden(q.geometry).forEach(z => {
      const a = map.latLngToContainerPoint([z.a[1], z.a[0]]), b = map.latLngToContainerPoint([z.b[1], z.b[0]]);
      const d = L.LineUtil.pointToSegmentDistance(p, a, b);
      if (!best || d < best.d) best = { d, q, z };
    }));
    if (!best || best.d > 24) { say("Tik op de rand van een gekozen perceel, aan de kant van het water.", true); return; }
    const { q, z } = best, alle = Perceel.zijden(q.geometry), run = Perceel.rechteZijde(alle, z.key);
    const lengte = alle.filter(x => run.includes(x.key)).reduce((a, x) => a + x.m, 0);
    const nr = sel.indexOf(q) + 1;
    // Zelfde type nog eens: weghalen. Ander type: omzetten.
    const was = q.oever[z.key];
    // Zelf aangewezen: telt vanaf de perceelrand, niet meer als gevonden water
    if (q.wauto) run.forEach(k => delete q.wauto[k]);
    if (was === huidigType) { run.forEach(k => delete q.oever[k]); say("Oever van " + mTxt(lengte) + " weggehaald bij perceel " + nr + "."); }
    else {
      run.forEach(k => q.oever[k] = huidigType);
      say("Oever van " + mTxt(lengte) + (was != null ? " omgezet naar " : " toegevoegd: ") + typeVan(huidigType).t + " (" + nlM(typeVan(huidigType).st[0]) + "), perceel " + nr + ". Bochtige sloot? Tik op het volgende stuk.");
    }
    bewaar(); teken();
  }
  // AB-kant kiezen: tik bij de kant van een perceel of kavel waar de AB-lijn langs moet
  let abModus = false;
  function setAB(aan) {
    if (aan && oeverModus) setOever(false);
    if (aan && koppelModus) setKoppel(false);
    abModus = aan;
    $("bAB").setAttribute("aria-pressed", aan);
    $("bAB").textContent = aan ? "Tik op de kant voor de AB-lijn" : "AB-kant kiezen";
    $("map").classList.toggle("oever", aan);
    if (aan) say("Tik op de kant van het perceel of de kavel waar de AB-lijn langs moet lopen.");
  }
  $("bAB").addEventListener("click", () => setAB(!abModus));
  function abTik(ll) {
    const p = map.latLngToContainerPoint(ll);
    // Kandidaten: kavels en losse percelen; de dichtstbijzijnde rand wint
    const objs = kavels.map(kv => ({ obj: kv, geom: kavelVorm(kv), opslaan: bewaarK, naam: kv.naam }))
      .concat(sel.filter(q => !kavelVan(q)).map(q => ({ obj: q, geom: q.geometry, opslaan: bewaar, naam: "perceel " + (sel.indexOf(q) + 1) })))
      .filter(o => o.geom);
    let best = null;
    objs.forEach(o => Perceel.zijden(o.geom).forEach(z => {
      const a = map.latLngToContainerPoint([z.a[1], z.a[0]]), b = map.latLngToContainerPoint([z.b[1], z.b[0]]);
      const d = L.LineUtil.pointToSegmentDistance(p, a, b);
      if (!best || d < best.d) best = { d, o };
    }));
    if (!best || best.d > 30) { say("Tik dichter bij de rand van een perceel of kavel.", true); return; }
    best.o.obj.abPunt = [ll.lng, ll.lat]; best.o.opslaan();
    setAB(false); teken();
    say("AB-lijn ligt nu langs de gekozen kant van " + best.o.naam + ".");
  }
  function setOever(aan) {
    if (aan && abModus) setAB(false);
    if (aan && koppelModus) { koppelModus = false; koppelSet.clear(); $("bKoppel").setAttribute("aria-pressed", false); $("bKoppel").textContent = "Percelen koppelen"; }
    oeverModus = aan;
    $("bOever").setAttribute("aria-pressed", aan);
    $("bOever").textContent = aan ? "Klaar met oevers" : "Oevers aanwijzen";
    $("map").classList.toggle("oever", aan);
    $("typeBox").hidden = !aan;
    say(aan ? "Tik op de randen langs het water. Nog eens tikken haalt een oever weg." : "Tik op een perceel om het toe te voegen. Nog eens tikken haalt het weg.");
  }
  $("bOever").addEventListener("click", () => setOever(!oeverModus));
  // Percelen koppelen tot een kavel
  function setKoppel(aan) {
    if (aan && oeverModus) setOever(false);
    if (aan && abModus) setAB(false);
    koppelModus = aan; koppelSet.clear();
    $("bKoppel").setAttribute("aria-pressed", aan);
    $("bKoppel").textContent = aan ? "Klaar met koppelen" : "Percelen koppelen";
    say(aan ? "Tik op de percelen die bij elkaar horen (minstens 2), daarna Klaar met koppelen." : "Tik op een perceel om het toe te voegen. Nog eens tikken haalt het weg.");
    teken();
  }
  function koppelTik(lat, lon) {
    const q = sel.find(x => Perceel.bevatPunt(x.geometry, lon, lat));
    if (!q) { say("Tik in een gekozen perceel.", true); return; }
    if (koppelSet.has(q.key)) koppelSet.delete(q.key); else koppelSet.add(q.key);
    teken();
    say(koppelSet.size + (koppelSet.size === 1 ? " perceel" : " percelen") + " gekozen. Tik op Klaar met koppelen als je ze allemaal hebt.");
  }
  $("bKoppel").addEventListener("click", () => {
    if (!koppelModus) { setKoppel(true); return; }
    const leden = [...koppelSet];
    if (leden.length < 2) { setKoppel(false); say("Kies minstens 2 percelen om te koppelen.", true); return; }
    const nr = Math.max(0, ...kavels.map(k => parseInt(String(k.naam).replace(/\D/g, ""), 10) || 0)) + 1;
    const kv = { naam: "Kavel " + nr, leden };
    if (!kavelVorm(kv)) { setKoppel(false); say("Deze percelen liggen niet tegen elkaar aan (meer dan ongeveer 3,5 m ertussen, bijvoorbeeld een sloot). Niet gekoppeld.", true); return; }
    kavels.forEach(k => k.leden = k.leden.filter(x => !leden.includes(x)));
    kavels = kavels.filter(k => k.leden.length >= 2);
    kavels.push(kv); bewaarK();
    setKoppel(false);
    say(kv.naam + ": " + leden.length + " percelen gekoppeld, samen " + haTxt(leden.reduce((t, k) => t + sel.find(q => q.key === k).ha, 0)) + " ha.");
  });
  // Water zoeken: randen langs BGT-water automatisch markeren; zelf aangewezen randen blijven staan
  $("bWater").addEventListener("click", async e => {
    const btn = e.currentTarget;
    if (btn.disabled || !sel.length) return;
    const old = btn.textContent;
    btn.disabled = true; btn.textContent = "Water zoeken…";
    const regels = [], ruwData = [];
    let fout = null;
    for (const [i, q] of sel.entries()) {
      try {
        const water = await Perceel.zoekWater(q.geometry);
        const hits = Perceel.waterLangsZijden(q.geometry, water);
        const alle = Perceel.zijden(q.geometry);
        let nat = 0, droog = 0;
        if (!q.wauto || typeof q.wauto !== "object") q.wauto = {};
        // Eerder gevonden randen die nu niet meer langs water liggen: weg
        Object.keys(q.wauto).forEach(k => { if (!hits[k]) { delete q.oever[k]; delete q.wauto[k]; } });
        Object.entries(hits).forEach(([k, h]) => {
          const t = h.droog ? "droog" : "nat", nieuw = q.oever[k] == null;
          if (!nieuw && q.oever[k] !== t) return; // zelf omgezet: blijft zoals aangewezen
          q.oever[k] = t; q.wauto[k] = true;
          if (!nieuw) return;
          const m = alle.find(z => z.key === k).m; if (h.droog) droog += m; else nat += m;
        });
        // Waterdelen en taluds bewaren (bijgeknipt): de strook wordt vanaf de insteek gerekend
        q.water = window.polygonClipping ? Perceel.waterBijPerceel(q.geometry, water, polygonClipping) : [];
        q.taludStatus = water.taludFout ? "fout" : "ok";
        q.waterTs = Date.now();
        if (water.taludFout) regels.push("Perceel " + (i + 1) + ": " + water.taludFout + " Gerekend vanaf de waterlijn.");
        regels.push("Perceel " + (i + 1) + ": " + (nat || droog ? [nat ? mTxt(nat) + " water" : "", droog ? mTxt(droog) + " greppel/droge sloot" : ""].filter(Boolean).join(", ") : "geen (nieuw) water langs de rand"));
        const wd = water.filter(w => !w.talud), td = water.filter(w => w.talud);
        ruwData.push({ perceel: i + 1, waterdelen: wd.length, taluds: td.length, voorbeeld: wd.slice(0, 3).map(w => w.properties), voorbeeldTalud: td.slice(0, 3).map(w => w.properties) });
      } catch (er) { fout = er; regels.push("Perceel " + (i + 1) + ": " + er.message); }
    }
    bewaar(); teken();
    btn.disabled = false; btn.textContent = old;
    say(regels.join(" · ") + (fout ? "" : ". Water staat op 'nat of kort droog' (3 m, vanaf de insteek van het talud): zet lang droogvallend en droge sloten zelf om via Oevers aanwijzen."), !!fout);
    ruw.textContent = JSON.stringify(ruwData, null, 2);
  });
  // Keuze type waterloop
  function renderTypes() {
    const box = $("typeSeg"); box.innerHTML = "";
    TYPES.forEach(t => {
      const bt = document.createElement("button"); bt.type = "button"; bt.setAttribute("aria-pressed", t.id === huidigType);
      bt.innerHTML = nlM(t.st[0]) + "<small>" + esc(t.t) + "</small>";
      const streep = document.createElement("i"); streep.style.borderTopColor = t.c; if (t.d) streep.style.borderTopStyle = "dashed";
      bt.appendChild(streep);
      bt.addEventListener("click", () => { huidigType = t.id; store.set("kaartTestType", t.id); renderTypes(); });
      box.appendChild(bt);
    });
  }
  renderTypes();
  map.on("click", ev => abModus ? abTik(ev.latlng) : koppelModus ? koppelTik(ev.latlng.lat, ev.latlng.lng) : oeverModus ? oeverTik(ev.latlng) : zoek(ev.latlng.lat, ev.latlng.lng));
  teken();
  // Paneel eronder groeit/krimpt: kaart laten meeschalen
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($("map"));

  $("bMij").addEventListener("click", async e => {
    const btn = e.currentTarget, old = btn.textContent;
    btn.disabled = true; btn.textContent = "Locatie zoeken…";
    try {
      const p = await Perceel.positie();
      if (!inNL(p.lat, p.lon)) { say("Je locatie ligt buiten Nederland; daar heeft PDOK geen kaart of percelen.", true); return; }
      if (mij) mij.remove();
      mij = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [22, 22] }), interactive: false }).addTo(map);
      map.setView([p.lat, p.lon], 16);
      say("Tik op een perceel op de kaart.");
    } catch (er) { say(er.message, true); }
    finally { btn.disabled = false; btn.textContent = old; }
  });
})();
</script>

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
