<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Perceelkaart</title>
<meta name="theme-color" content="#2F5A2B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Perceelkaart">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Lettertypen staan in de app zelf (Barlow, SIL OFL; zie fonts/OFL.txt): geen verzoeken naar Google */
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/barlow-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-style: normal; font-weight: 500; font-display: swap; src: url(fonts/barlow-semi-condensed-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Barlow Semi Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2"); }
/* Zelfde kleuren en stijl als de Zaaihulp */
:root {
  --bg: #E9EDE6; --surface: #F8FAF6; --ink: #1C2318; --muted: #5B6653; --line: #C9D1C2;
  --accent: #2F5A2B; --accent-ink: #F3F7EF; --warn: #A3401F; --hl: #E8B400;
  color-scheme: light; box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141912; --surface: #1D241A; --ink: #E6ECE0; --muted: #9BA892; --line: #34402F;
    --accent: #8DBA6A; --accent-ink: #12180F; --warn: #F08A5F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141912; --surface: #1D241A; --ink: #E6ECE0; --muted: #9BA892; --line: #34402F;
  --accent: #8DBA6A; --accent-ink: #12180F; --warn: #F08A5F; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
/* Alleen de kaart zoomt, niet de hele pagina (anders worden de labels op de kaart mee groter) */
html { touch-action: pan-x pan-y; }
body {
  margin: 0; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  font-family: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px; line-height: 1.4; -webkit-tap-highlight-color: transparent;
  padding-top: env(safe-area-inset-top, 0px);
}
.num { font-family: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; font-weight: 700; font-variant-numeric: tabular-nums; }
header { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 10px 16px; }
header h1 { margin: 0; font: 700 22px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; }
.voet { text-align: center; margin: 22px 0 4px; font-size: 13px; color: var(--muted); }
#map { flex: 1; min-height: 45vh; background: var(--line); }
.leaflet-container { font: inherit; }
.panel { background: var(--bg); padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 640px; width: 100%; margin: 0 auto; }
/* Tablet staand (of een hoog scherm): meer kaart */
@media (min-height: 900px) and (orientation: portrait) { #map { min-height: 55vh; } }
/* Tablet (of telefoon) liggend: kaart links over de volle hoogte, bediening rechts in een eigen scrollende kolom */
@media (min-width: 900px) and (orientation: landscape) {
  html, body { height: 100%; overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr minmax(380px, 34%); grid-template-rows: auto 1fr; }
  header { grid-column: 1 / -1; }
  #map { grid-column: 1; grid-row: 2; min-height: 0; height: 100%; }
  .panel { grid-column: 2; grid-row: 2; max-width: none; margin: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; border-left: 1px solid var(--line); }
}
.row { display: flex; gap: 10px; }
.namen { margin-top: 8px; }
.tabs { display: flex; gap: 4px; margin: -4px 0 12px; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; min-height: 46px; background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: 600 17px "Barlow", system-ui, sans-serif; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
#paneelNamen .lbl2 { margin-top: 4px; }
#namenHint:empty { display: none; }
.groep { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); }
.groep .chk { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; font-size: 16px; color: var(--ink); }
.groep .chk input { width: 22px; height: 22px; min-height: 0; flex: none; margin: 0; padding: 0; accent-color: var(--accent); }
.groep .vk { display: grid; grid-template-columns: 7em 1fr; gap: 8px; align-items: center; }
.groep [hidden] { display: none !important; }
.namen .lijst { display: flex; flex-wrap: wrap; gap: 6px; }
.namen .btn { flex: none; min-height: 40px; font-size: 15px; padding: 0 12px; }
.namen .opslaan { display: flex; gap: 6px; margin-top: 6px; }
.namen input { flex: 1; min-width: 0; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 16px; padding: 0 8px; outline: none; }
.namen input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.namen .meta { margin-top: 6px; }
.namenlijst { margin-top: 4px; }
.namen .binnen { margin: 6px 0 8px; }
.log li.uitgelicht .name { color: #e8590c; font-weight: 700; }
.namenlijst li { cursor: pointer; }
.namenlijst .nr { color: var(--accent); font-weight: 700; }
.namenlijst li.actief .name { color: var(--accent); font-weight: 700; }
.btn { flex: 1; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 17px "Barlow", system-ui, sans-serif; }
a.btn.link { display: flex; align-items: center; justify-content: center; text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.vrij .vrow { display: grid; grid-template-columns: 5.5em 1fr auto; gap: 8px; align-items: center; margin-top: 6px; }
.vrij .vrow label { color: var(--muted); font-weight: 500; }
.vrij .vrow .kiesAB { min-height: 44px; border-radius: 8px; border: 2px solid #e8590c; background: #e8590c; color: #fff; font: 700 18px "Barlow", system-ui, sans-serif; }
.vrij .vrow .kiesAB[aria-pressed="true"] { background: #fff; color: #e8590c; box-shadow: 0 0 0 3px rgba(232, 89, 12, .45); }
.vrij .vrow input { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 16px; padding: 0 8px; outline: none; }
.vrij .vrow input.num { text-align: right; font-size: 20px; }
.vrij .vrow input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.vrij .kort { display: grid; gap: 4px; margin: 10px 0 6px; font-size: 18px; }
.vrij .kort div { display: grid; grid-template-columns: 8em 1fr; gap: 8px; align-items: baseline; }
.vrij .kort span { color: var(--muted); font-size: 14px; }
.vrij .ab { margin-top: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.abl.vrijp { background: #e8590c; color: #fff; border-color: #fff; font-size: 15px; line-height: 22px; }
.abl.vrijp.gekozen { background: #fff; color: #e8590c; border-color: #e8590c; box-shadow: 0 0 0 4px rgba(232, 89, 12, .45); }
.hint { font-size: 15px; color: var(--muted); margin-top: 8px; min-height: 1.4em; }
.hint.warn { color: var(--warn); font-weight: 600; }
.advice { margin-top: 10px; background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 15px; }
.advice .adv-main { font-size: 36px; line-height: 1.1; }
.advice .meta { color: var(--muted); }
details { margin-top: 10px; font-size: 14px; color: var(--muted); }
details pre { white-space: pre-wrap; word-break: break-all; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--ink); font: 12px ui-monospace, Menlo, Consolas, monospace; max-height: 220px; overflow: auto; }
.tot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.tot .adv-main { font-size: 40px; white-space: nowrap; }
.log { list-style: none; margin: 8px 0 0; padding: 0; border-top: 1px solid var(--line); }
.log li { display: grid; grid-template-columns: 30px 1fr auto 44px; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log .nr { font-size: 18px; color: var(--muted); text-align: center; }
.log .go { border: 0; background: none; color: inherit; text-align: left; padding: 0; font: inherit; min-width: 0; }
.log .name { font-weight: 500; overflow-wrap: anywhere; }
.log .van { display: inline-block; font-size: 13px; font-weight: 600; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 0 8px; margin-bottom: 2px; }
.log .meta { font-size: 14px; color: var(--muted); }
.log .w { font-size: 21px; text-align: right; }
.log .w small, .kavel .w small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); line-height: 1.3; white-space: pre-line; }
/* Uitleg onder het netto breekt af, anders drukt hij de naam van het perceel plat */
.log .w, .kavel .w { max-width: 30vw; }
.del { border: 0; background: none; color: var(--muted); font-size: 24px; width: 44px; height: 44px; border-radius: 8px; }
.armed { color: var(--warn) !important; font-weight: 700 !important; }
.leaflet-tooltip.pnr { background: var(--hl); border: 0; color: #1C2318; font: 700 15px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; padding: 1px 7px; border-radius: 999px; box-shadow: none; }
.leaflet-tooltip.pnr::before { display: none; }
.lbl2 { margin-top: 10px; color: var(--muted); font-weight: 500; }
.seg4 { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); margin-top: 6px; }
.seg4 button { border: 0; background: transparent; color: var(--ink); padding: 6px 2px 8px; min-height: 64px; font: 700 20px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.seg4 button small { font: 500 12px "Barlow", system-ui, sans-serif; color: var(--muted); line-height: 1.1; text-align: center; }
.seg4 button i { display: block; width: 70%; height: 0; border-top: 5px solid; margin-top: 3px; }
.seg4 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg4 button[aria-pressed="true"] small { color: var(--accent-ink); }
.warn4 { color: var(--warn); font-weight: 600; }
/* Tabblad Kunstmest */
#paneelKm .vk { display: grid; grid-template-columns: 6em 1fr; gap: 8px; align-items: center; margin-top: 8px; }
#paneelKm input, #paneelKm textarea { width: 100%; min-width: 0; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: 16px "Barlow", system-ui, sans-serif; padding: 6px 8px; outline: none; box-sizing: border-box; }
#paneelKm textarea { min-height: 60px; resize: vertical; }
#paneelKm input:focus, #paneelKm textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
#paneelKm .kop { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; }
#paneelKm .wie { font-size: 20px; font-weight: 700; color: var(--accent); }
#paneelKm .kop .w { font-size: 21px; text-align: right; }
#paneelKm .kop small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
#paneelKm .liters { font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 8px; }
#paneelKm .liters span { font-size: 15px; font-weight: 400; color: var(--muted); }
#paneelKm .uit { display: grid; gap: 3px; margin: 8px 0 2px; font-size: 17px; color: var(--ink); }
#paneelKm .uit div { display: grid; grid-template-columns: 6em 1fr; gap: 8px; align-items: baseline; }
#paneelKm .uit span { color: var(--muted); font-size: 14px; }
#paneelKm .knoppen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
#paneelKm .knoppen[hidden] { display: none; }
#paneelKm .btn { flex: none; min-height: 44px; font-size: 15px; padding: 0 12px; }
#paneelKm .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#paneelKm .log li { grid-template-columns: 30px 1fr auto 24px; cursor: pointer; }
#paneelKm .log li.gekozen .name { color: #e8590c; font-weight: 700; }
#paneelKm .log .ok { color: var(--accent); font-weight: 700; text-align: center; }
#paneelKm .tankrij { margin-top: 14px; }
#kmHint:empty { display: none; }
.leaflet-tooltip.kml { background: #fff; border: 0; color: #1C2318; font: 700 13px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; padding: 0 6px; border-radius: 999px; box-shadow: 0 0 0 1px #1C2318; }
.leaflet-tooltip.kml.klaar { background: #2b8a3e; color: #fff; }
.leaflet-tooltip.kml::before { display: none; }
/* Uitgezoomd (onder 16) geen liters op de kaart: inzoomen om ze te zien */
#map.verKm .leaflet-tooltip.kml { display: none; }
a.btn.klein { min-height: 44px; font-size: 15px; margin-top: 6px; width: auto; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; flex: none; }
#paneelKm a.btn { display: inline-flex; align-items: center; text-decoration: none; }
.af { color: var(--ink); font-weight: 600; margin-top: 2px; }
.log .detail { grid-column: 2 / -1; font-size: 14px; color: var(--muted); margin-top: -2px; }
.btab { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 15px; font-variant-numeric: tabular-nums; }
.btab th { text-align: left; font-weight: 500; font-size: 13px; color: var(--muted); padding: 0 6px 2px 0; }
.btab td { padding: 3px 6px 3px 0; color: var(--muted); }
.btab td.r, .btab th.r { text-align: right; }
.btab tr.telt td { color: var(--ink); font-weight: 600; }
.btab tr.telt td:last-child { color: var(--accent); }
.spuit { display: grid; grid-template-columns: 1fr 84px auto; gap: 10px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.spuit label { color: var(--muted); font-weight: 500; }
.spuit input { width: 100%; min-height: 48px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 22px; text-align: right; padding: 0 10px; outline: none; }
.spuit input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.spuit .btn { min-height: 48px; padding: 0 14px; flex: none; }
.spuit .ronde { grid-column: 1 / -1; }
.spuit [hidden] { display: none !important; } /* ook knoppen met een eigen display (1,50/1,80, klok) */
.spuit .aanuit { grid-column: 1 / -1; display: flex; gap: 8px; }
.spuit .aanuit .btn { flex: 1; }
.spuit .spoorKeus { display: flex; gap: 4px; }
.spuit .spoorKeus .btn { min-height: 48px; padding: 0 8px; }
.klap > summary { cursor: pointer; list-style: none; color: var(--accent); font-weight: 600; padding: 6px 0; overflow-wrap: anywhere; }
.klap > summary::-webkit-details-marker { display: none; }
.klap > summary::before { content: "▸ "; }
.klap[open] > summary::before { content: "▾ "; }
.klap > div, .klap > table { margin-top: 4px; }
.sp .zaai { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
.sp .zaai .btab td:nth-child(5) { font-weight: 600; color: var(--ink); }
.sp .zaai .btab tr.buiten td { color: var(--warn); }
.sp .zaai .kort { display: grid; gap: 4px; margin: 4px 0 6px; font-size: 17px; color: var(--ink); }
.sp .zaai .kort div { display: grid; grid-template-columns: 7.5em 1fr; gap: 8px; align-items: baseline; }
.sp .zaai .kort span { color: var(--muted); font-size: 14px; }
.sp .zaai .zdet summary { cursor: pointer; color: var(--accent); font-weight: 600; padding: 6px 0; }
.sp .zaai .zdet > div { margin-top: 4px; }
.sp .zaai .knoppen { display: flex; flex-wrap: wrap; gap: 6px; }
.zl { background: #f2c200; color: #1C2318; font: 700 12px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; border-radius: 4px; padding: 0 4px; line-height: 15px; white-space: nowrap; transform: translate(-50%, -50%); display: inline-block; box-shadow: 0 0 0 2px #1C2318; }
.zl.st { background: #e8590c; color: #fff; font-size: 13px; }
.zl.rd { background: #9c36b5; color: #fff; }
.zl.rk { background: #e5dbff; color: #1C2318; }
.zb { background: #fff; color: #1C2318; font: 700 11px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; border-radius: 999px; min-width: 15px; line-height: 15px; text-align: center; white-space: nowrap; transform: translate(-50%, -50%); display: inline-block; box-shadow: 0 0 0 1px #1C2318; }
.zpijl { color: #fff; font-size: 16px; line-height: 28px; text-align: center; text-shadow: 0 0 3px #000, 0 0 3px #000; }
.zpijl.st { color: #ffd8a8; font-size: 20px; }
/* Uitgezoomd: alleen START en de ronde, anders staan de nummers op elkaar */
#map.ver .zb, #map.ver .zl:not(.st):not(.rd), #map.ver .zl.rk, #map.ver .zpijl:not(.st) { display: none; }
.sp .zaai .start { margin: 6px 0; padding: 8px 10px; border-left: 3px solid var(--accent); background: var(--bg); color: var(--ink); }
.kavel { margin-top: 10px; border: 2px solid #e8590c; border-radius: 10px; padding: 10px 12px; }
.kavel .kop { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: baseline; }
.kavel .naam { font-weight: 600; }
.kavel .w { font-size: 21px; }
.kavel .meta { font-size: 14px; color: var(--muted); }
.kavel .klein { min-height: 40px; font-size: 15px; margin-top: 6px; width: auto; padding: 0 12px; display: inline-flex; }
.leaflet-tooltip.kav { background: #e8590c; color: #fff; }
#bBron[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#bKoppel[aria-pressed="true"] { background: #e8590c; border-color: #e8590c; color: #fff; }
.spuit .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sp { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
.sp strong { color: var(--ink); font-weight: 600; }
.sp .ab { margin-top: 4px; font-variant-numeric: tabular-nums; }
.sp .klein { min-height: 40px; font-size: 15px; margin-top: 6px; width: auto; padding: 0 12px; display: inline-flex; }
.spnr { background: #1C2318; color: #fff; font: 700 13px "Barlow Semi Condensed", "Barlow", system-ui, sans-serif; border-radius: 999px; padding: 0 6px; line-height: 18px; text-align: center; white-space: nowrap; }
.spijl { color: #fff; font-size: 18px; line-height: 20px; text-align: center; text-shadow: 0 0 3px #000; }
.abl { background: #fff; color: #1C2318; font: 700 13px "Barlow", system-ui, sans-serif; border: 2px solid #1C2318; border-radius: 4px; text-align: center; line-height: 16px; }
.toggle { width: 100%; margin-top: 10px; flex: none; }
#map.oever { cursor: crosshair; }
.me { width: 16px; height: 16px; border-radius: 50%; background: #3a6fd1; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header>
  <h1>Perceelkaart</h1>
</header>
<div id="map" role="application" aria-label="Kaart, tik op een perceel"></div>
<div class="panel">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tabPerc" aria-selected="true">Percelen</button>
    <button type="button" role="tab" id="tabNamen" aria-selected="false">Namen</button>
    <button type="button" role="tab" id="tabKm" aria-selected="false">Kunstmest</button>
  </div>
  <div id="paneelPerc">
  <div class="row">
    <button type="button" class="btn" id="bLaag" aria-pressed="false">Luchtfoto</button>
    <button type="button" class="btn" id="bMij">Mijn locatie</button>
  </div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn" id="bBron" aria-pressed="false">Grenzen: BRP-gewasperceel</button></div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn" id="bVrij" aria-pressed="false">AB-lijn meten</button><button type="button" class="btn" id="bAB" aria-pressed="false">AB-kant kiezen</button></div>
  <div class="advice vrij" id="vrijBox" hidden>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/polygon-clipping/polygon-clipping.umd.min.js"></script>
<script src="perceel.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const hint = $("hint"), info = $("info"), ruw = $("ruw");
  const say = (t, warn) => {
    hint.textContent = t; hint.className = "hint" + (warn ? " warn" : "");
    const nh = $("namenHint"); if (nh) { nh.textContent = t; nh.className = "hint" + (warn ? " warn" : ""); }
  };
  const parse = v => { const n = parseFloat(String(v || "").replace(/\s/g, "").replace(",", ".")); return isFinite(n) ? n : null; };
  const mTxt = v => Math.round(v).toLocaleString("nl-NL") + " m";
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const haTxt = v => v.toLocaleString("nl-NL", { minimumFractionDigits: 3, maximumFractionDigits: 3, useGrouping: false });
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { say("De opslag van de telefoon is vol: dit is NIET bewaard. Haal percelen of namen weg.", true); return false; } }
  };
  if (!window.L) { say("Kaart kon niet laden. Heb je internet?", true); return; }
  if (!window.Perceel) { say("perceel.js kon niet laden.", true); return; }

  // Laatste kaartbeeld onthouden; eerste keer heel Nederland
  // PDOK-kaarten dekken alleen Nederland: kaart daarbinnen houden, anders zie je niks
  const NL = L.latLngBounds([50.6, 3.1], [53.7, 7.4]);
  const inNL = (lat, lon) => NL.contains([lat, lon]);
  let view = store.get("kaartTestView", null);
  if (!view || !inNL(view.lat, view.lon) || !(view.z >= 7)) view = { lat: 52.15, lon: 5.4, z: 8 };
  const map = L.map("map", { zoomControl: true, attributionControl: true, minZoom: 7, maxZoom: 22, maxBounds: NL.pad(0.05), maxBoundsViscosity: 1 })
    .setView([view.lat, view.lon], view.z);
  store.set("kaartTestView", view);
  map.on("moveend", () => { const c = map.getCenter(); store.set("kaartTestView", { lat: c.lat, lon: c.lng, z: map.getZoom() }); });
  // Uitgezoomd (onder 17) de kleine zaailabels verbergen
  // iPhone negeert user-scalable=no: knijpen buiten de kaart tegenhouden
  ["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => { if (!e.target.closest || !e.target.closest("#map")) e.preventDefault(); }, { passive: false }));
  const zoomKlasse = () => { $("map").classList.toggle("ver", map.getZoom() < 17); $("map").classList.toggle("verKm", map.getZoom() < 16); };
  map.on("zoomend", zoomKlasse); zoomKlasse();

  // PDOK-achtergronden (Web Mercator, geen key)
  const attr = 'Kaart: <a href="https://www.pdok.nl">PDOK</a>, Kadaster';
  const BRT_URL = "https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/standaard/EPSG:3857/{z}/{x}/{y}.png";
  const FOTO_URL = "https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/Actueel_orthoHR/EPSG:3857/{z}/{x}/{y}.jpeg";
  const brt = L.tileLayer(BRT_URL, { minZoom: 7, maxNativeZoom: 19, maxZoom: 22, attribution: attr });
  const foto = L.tileLayer(FOTO_URL, { minZoom: 7, maxNativeZoom: 19, maxZoom: 22, attribution: "Luchtfoto: " + attr });
  let isFoto = store.get("kaartTestFoto", false);
  const setLaag = () => {
    (isFoto ? brt : foto).remove(); (isFoto ? foto : brt).addTo(map);
    $("bLaag").setAttribute("aria-pressed", isFoto); store.set("kaartTestFoto", isFoto);
  };
  $("bLaag").addEventListener("click", () => { isFoto = !isFoto; setLaag(); });
  setLaag();

  // Bevestigen zonder pop-up, zoals in de app: eerste tik vraagt "zeker?", tweede tik voert uit
  function armed(btn, label) {
    if (btn.dataset.armed === "1") { clearTimeout(btn._t); btn.dataset.armed = ""; btn.classList.remove("armed"); btn.textContent = btn._old; return true; }
    btn.dataset.armed = "1"; btn._old = btn.textContent; btn.textContent = label; btn.classList.add("armed");
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.dataset.armed = ""; btn.classList.remove("armed"); btn.textContent = btn._old; }, 3000);
    return false;
  }

  let punt = null, mij = null, bezig = 0;
  const stijl = () => ({ color: getComputedStyle(document.documentElement).getPropertyValue("--hl").trim() || "#E8B400", weight: 3, fillOpacity: .2 });
  // Bron van de perceelgrenzen: BRP-gewasperceel (ingetekend) of referentieperceel (RVO, uit de BGT)
  let bronRef = store.get("kaartBronRef", false);
  const zetBron = () => {
    $("bBron").setAttribute("aria-pressed", bronRef);
    $("bBron").textContent = "Grenzen: " + (bronRef ? "referentieperceel (BGT)" : "BRP-gewasperceel");
  };
  // Omzetten: nieuwe percelen uit de gekozen bron, en de gekozen percelen gaan mee (de andere grens blijft bewaard)
  $("bBron").addEventListener("click", async () => {
    bronRef = !bronRef; store.set("kaartBronRef", bronRef); zetBron();
    const uitleg = bronRef ? "Nieuwe percelen komen uit de referentiepercelen: de kavel volgens de topografische kaart, meestal tot de slootkant." : "Nieuwe percelen komen uit het BRP: het ingetekende gewasperceel.";
    const om = sel.filter(q => q.ref !== bronRef);
    if (!om.length) { say(uitleg); return; }
    const naam = bronRef ? "referentieperceel" : "BRP-perceel", doel = bronRef;
    say("Percelen omzetten naar " + naam + "…");
    const mis = []; let n = 0;
    for (const q of om) {
      altGeprobeerd.delete(q.key);
      await haalAlt(q);
      if (bronRef !== doel) return; // intussen weer teruggezet
      const nr = sel.indexOf(q) + 1;
      if (!nr || q.ref === doel) continue;
      const r = wissel(q);
      if (r === true) n++;
      else mis.push("perceel " + nr + (r === "dubbel" ? " heeft hetzelfde " + naam + " als een ander perceel" : q.alt && q.alt.geen ? ": geen " + naam + " op deze plek" : ": niet opgehaald (geen verbinding?)"));
    }
    bewaar(); teken();
    say((n ? n + (n === 1 ? " perceel" : " percelen") + " omgezet naar " + naam + ". " : "") + (mis.length ? "Niet omgezet: " + mis.join("; ") + ". " : "") + uitleg, mis.length > 0);
  });
  zetBron();
  const sleutel = p => (p.ref ? "ref:" : "") + (p.id != null ? "id:" + p.id : "g:" + JSON.stringify(p.geometry.coordinates).slice(0, 120));

  // Selectie: meerdere percelen bij elkaar opgeteld, wordt onthouden
  // BRP van het lopende jaar (concept) voor een eigen regio, uitgeknipt uit de PDOK-download; daarbuiten PDOK
  Perceel.gebruikRegio("brp2026/");
  let sel = store.get("kaartTestSelectie", []);
  // Namen (bijv. per klant of boer): percelen en kavels bewaard onder een naam, alleen op deze telefoon.
  // Is een naam actief, dan worden wijzigingen daar vanzelf in bijgewerkt.
  let namen = store.get("kaartNamen", []);
  if (!Array.isArray(namen)) namen = [];
  namen = namen.filter(n => n && typeof n.naam === "string" && (Array.isArray(n.sel) || n.opKaart));
  let naamActief = store.get("kaartNaamActief", null);
  let groepPlanFn = () => {}; // groep bijwerken na een wijziging (wordt verderop ingevuld)
  const eigenCache = new Map(); // perceel -> namen (niet de naam op de kaart) waar het ook onder staat; leeg bij elke wijziging van de namen
  // Staat er een naam op de kaart, dan is een tik bekijken (uitgelicht); toevoegen of weghalen alleen na Percelen wijzigen
  let wijzigen = false, uitgelicht = null;
  // De naam die op de kaart staat, is niet dubbel bewaard: zijn percelen zijn de kaart (kaartTestSelectie)
  const opKaart = namen.find(n => n.opKaart);
  if (opKaart) naamActief = opKaart.naam;
  if (!namen.some(n => n.naam === naamActief)) naamActief = null;
  if (!Array.isArray(sel)) sel = [];
  sel = sel.filter(q => q && q.geometry && typeof q.ha === "number");
  namen.forEach(n => { if (n.opKaart) { n.sel = sel; delete n.opKaart; } });
  // Versie 83 had "gedaan" bij de naam; nu per perceel
  let kmOm = false;
  namen.forEach(n => { if (n.km && n.km.gedaan) { const g = n.km.gedaan; (n.sel || []).forEach(q => { if (!(q.km && q.km.gedaan)) q.km = Object.assign({}, q.km, { gedaan: g }); }); delete n.km.gedaan; kmOm = true; } });
  if (kmOm) { store.set("kaartTestSelectie", sel); try { localStorage.setItem("kaartNamen", JSON.stringify(namen.map(n => n.naam === naamActief ? Object.assign({ naam: n.naam, ts: n.ts, opKaart: true }, n.km ? { km: n.km } : {}) : n))); } catch (e) {} }
  // Eerder bewaard water was een hele rechthoek rond het perceel (honderden kB per perceel): eenmalig inkorten
  const kortWater = lijst => {
    let iets = false;
    lijst.forEach(q => [q, q.alt].forEach(x => {
      if (!x || x.waterKort || !Array.isArray(x.water) || !x.water.length || !x.geometry || !window.polygonClipping) return;
      try { x.water = Perceel.waterBijPerceel(x.geometry, x.water, polygonClipping); x.waterKort = 1; delete x.reken; iets = true; } catch (e) { /* dan zo laten */ }
    }));
    return iets;
  };
  if (kortWater(sel)) store.set("kaartTestSelectie", sel);
  let namenKort = false;
  namen.forEach(n => { if (n.sel !== sel && kortWater(n.sel)) namenKort = true; });
  if (namenKort) try { localStorage.setItem("kaartNamen", JSON.stringify(namen.map(naarOpslag))); } catch (e) {}
  // Oppervlakte opnieuw uit de grens (eerder bewaard op 2 decimalen)
  sel.forEach(q => { try { q.ha = Perceel.oppervlakteHa(q.geometry); if (q.alt && q.alt.geometry) q.alt.ha = Perceel.oppervlakteHa(q.alt.geometry); } catch (e) {} });
  const nieuwPerceel = p => ({ key: sleutel(p), gewas: p.gewas || (p.ref ? "Referentieperceel" : ""), jaar: p.jaar, status: p.status || "", ha: p.ha, bron: p.bron, ref: !!p.ref, geometry: p.geometry, oever: {} });
  // Andere grens per perceel (BRP <-> referentieperceel), in q.alt. Alles wat bij een grens hoort wisselt mee,
  // zodat terugwisselen de oevers, het gevonden water en de sleutel (kavels) terugzet.
  const GRENS = ["key", "gewas", "jaar", "status", "ha", "bron", "ref", "geometry", "oever", "wauto", "water", "taludStatus", "waterTs", "extraWater", "reken", "waterKort"];
  const altBezig = new Map(), altGeprobeerd = new Set();
  // Overlap: ligt een gekozen perceel binnen een ander (bijv. referentieperceel over twee BRP-percelen)? Dan telt het dubbel.
  const middenCache = new Map();
  const midden = q => { if (!middenCache.has(q.key)) middenCache.set(q.key, Perceel.binnenPunt(q.geometry)); return middenCache.get(q.key); };
  const binnenAnder = q => { const m = midden(q); return m ? sel.findIndex(x => x !== q && x.ha >= q.ha && Perceel.bevatPunt(x.geometry, m[0], m[1])) : -1; };
  function haalAlt(q) {
    if (q.alt) return Promise.resolve(q.alt);
    if (altBezig.has(q.key)) return altBezig.get(q.key);
    const key = q.key, ref = !q.ref, pt = Perceel.binnenPunt(q.geometry);
    const pr = (pt ? Perceel.zoekOpPunt(pt[0], pt[1], ref ? { api: Perceel.API_REF, cacheKey: "perceelCacheRef" } : undefined) : Promise.reject(null))
      .then(r => { r.perceel.ref = ref; return nieuwPerceel(r.perceel); })
      .catch(e => e && e.code === "geen-perceel" ? { geen: true } : null)
      .then(alt => {
        altBezig.delete(key);
        const h = sel.find(x => x.key === key);
        if (!alt) { altGeprobeerd.add(key); if (h) teken(); }
        else if (h && !h.alt) { h.alt = alt; bewaar(); teken(); }
        return h ? h.alt : null;
      });
    altBezig.set(key, pr);
    return pr;
  }
  // Wissel een perceel naar zijn andere grens: true, "dubbel" (die grens is al gekozen) of false (geen andere grens)
  function wissel(q) {
    const a = q.alt;
    if (!a || a.geen) return false;
    if (sel.some(x => x !== q && x.key === a.key)) return "dubbel";
    const oud = {};
    GRENS.forEach(k => { if (q[k] !== undefined) oud[k] = q[k]; delete q[k]; });
    GRENS.forEach(k => { if (a[k] !== undefined) q[k] = a[k]; });
    if (!q.oever || typeof q.oever !== "object") q.oever = {};
    q.alt = oud;
    kavels.forEach(kv => kv.leden = kv.leden.map(x => x === oud.key ? q.key : x));
    bewaarK();
    return true;
  }
  // Nieuwere BRP-intekening: bij het openen (met bereik) kijken of PDOK een nieuwer jaar heeft dan het bewaarde
  // BRP-perceel (q zelf, of q.alt als het referentieperceel gekozen is). Gevonden: q.nieuwer, met een knop om over te stappen.
  const brpVan = q => q.ref ? (q.alt && !q.alt.geen && !q.alt.ref ? q.alt : null) : q;
  const jaarNu = new Date().getFullYear();
  async function controleerJaar() {
    if (typeof navigator !== "undefined" && navigator.onLine === false) return;
    let iets = false;
    for (const q of sel.slice()) {
      const b = brpVan(q), oud = b && Number(b.jaar);
      if (!oud || oud >= jaarNu || (q.nieuwer && Number(q.nieuwer.jaar) > oud)) continue;
      const pt = Perceel.binnenPunt(b.geometry);
      if (!pt) continue;
      try {
        const r = await Perceel.zoekOpPunt(pt[0], pt[1]);
        if (r.perceel.bron !== "online" || !(Number(r.perceel.jaar) > oud) || !sel.includes(q) || brpVan(q) !== b) continue;
        r.perceel.ref = false;
        // Zelfde grens en gewas als het bewaarde jaar: niets te melden
        if (Math.abs(r.perceel.ha - b.ha) < 0.0005 && (r.perceel.gewas || "") === (b.gewas || "")) continue;
        q.nieuwer = nieuwPerceel(r.perceel); iets = true;
      } catch (e) { if (e && e.code === "offline") return; }
    }
    if (iets) { bewaar(); teken(); }
  }
  // Overstappen op de nieuwere intekening. Oevers en gevonden water horen bij de oude grens en vervallen.
  function naarNieuwer(q) {
    const n = q.nieuwer, b = brpVan(q);
    if (!n || !b) return false;
    if (sel.some(x => x !== q && x.key === n.key)) return "dubbel";
    if (b === q) {
      const oudKey = q.key;
      ["wauto", "water", "taludStatus", "waterTs", "reken", "waterKort"].forEach(k => delete q[k]);
      Object.assign(q, n, { oever: {} });
      kavels.forEach(kv => kv.leden = kv.leden.map(x => x === oudKey ? q.key : x));
      bewaarK();
    } else q.alt = Object.assign({}, n, { oever: {} }, q.alt && q.alt.extraWater ? { extraWater: q.alt.extraWater } : {});
    delete q.nieuwer;
    return true;
  }
  setTimeout(controleerJaar, 1500);

  // Oevers aanwijzen: tik bij de rand, het hele rechte stuk gaat aan of uit

  // Perceel of kavel bij een punt: waar het in ligt, anders de dichtstbijzijnde rand (binnen 40 px). Voor AB-lijn meten -> perceel.

      const bt = document.createElement("button"); bt.type = "button"; bt.setAttribute("aria-pressed", t.id === huidigType);
      bt.innerHTML = nlM(t.st[0]) + "<small>" + esc(t.t) + "</small>";
      const streep = document.createElement("i"); streep.style.borderTopColor = t.c; if (t.d) streep.style.borderTopStyle = "dashed";
      bt.appendChild(streep);
      bt.addEventListener("click", () => { huidigType = t.id; store.set("kaartTestType", t.id); renderTypes(); });
      box.appendChild(bt);
    });
  }
  renderTypes();
  map.on("click", ev => tabNu === "km" ? kmTik(ev.latlng.lat, ev.latlng.lng) : vrijModus ? vrijTik(ev.latlng) : abModus ? abTik(ev.latlng) : koppelModus ? koppelTik(ev.latlng.lat, ev.latlng.lng) : oeverModus ? oeverTik(ev.latlng) : zoek(ev.latlng.lat, ev.latlng.lng));
  teken();
  // Paneel eronder groeit/krimpt: kaart laten meeschalen
  if (window.ResizeObserver) new ResizeObserver(() => map.invalidateSize()).observe($("map"));

  // Installatielink delen (zelfde als bij de Zaaihulp): via het deelmenu van de telefoon, anders kopiëren
  $("bDeel").addEventListener("click", async () => {
    const url = new URL("installeren.html", location.href).href, hint = $("deelHint");
    try {
      if (navigator.share) { await navigator.share({ title: "Perceelkaart", text: "Perceelkaart (en de Zaaihulp) installeren op je telefoon:", url }); hint.textContent = "Gedeeld."; }
      else if (navigator.clipboard) { await navigator.clipboard.writeText(url); hint.textContent = "Link gekopieerd: " + url; }
      else hint.textContent = url;
    } catch (e) { if (e && e.name !== "AbortError") hint.textContent = url; }
  });
  // Opslag beschermen: vraag de browser de gegevens niet op te ruimen bij weinig ruimte, en laat zien of dat lukte
  (async () => {
    const el = $("opslagStand");
    try {
      if (!navigator.storage || !navigator.storage.persisted) { el.textContent = "Opslag: deze browser zegt niet of de gegevens beschermd zijn."; return; }
      let p = await navigator.storage.persisted();
      if (!p && navigator.storage.persist) p = await navigator.storage.persist();
      el.textContent = p ? "Opslag: beschermd, de browser ruimt de gegevens niet zomaar op."
        : "Opslag: niet beschermd, bij weinig ruimte mag de browser de gegevens opruimen. Op het beginscherm installeren helpt vaak.";
    } catch (e) { el.textContent = ""; }
  })();
  // AB-lijn meten, los van percelen: A en B tikken, slepen, intikken of GPS; koers, afstand, midden en opzij schuiven
  let vrijModus = false;
  const vrij = Object.assign({ a: null, b: null, s: "", links: false, k: "" }, store.get("kaartVrijAB", {}));
  const vrijLaag = L.layerGroup().addTo(map), vrijLijn = L.layerGroup().addTo(map), vrijM = {};
  const bewaarVrij = () => store.set("kaartVrijAB", vrij);
  const llTxt = c => c ? c[1].toFixed(8) + ", " + c[0].toFixed(8) : "";
  // "52.68, 5.20", "52,68 5,20", "52.68 5.20"; omgedraaid (lon, lat) wordt rechtgezet
  function leesPunt(t) {
    t = String(t || "").trim(); if (!t) return null;
    const getallen = (/\./.test(t) ? t.replace(/,/g, " ").match(/-?\d+(?:\.\d+)?/g) : (t.match(/-?\d+(?:,\d+)?/g) || []).map(x => x.replace(",", "."))) || [];
    if (getallen.length !== 2) return null;
    let [x, y] = getallen.map(Number);
    if (x < 10 && y > 40) [x, y] = [y, x];
    return x > 50 && x < 54 && y > 3 && y < 8 ? [y, x] : null;
  }
  function tekenVrij() {
    vrijLijn.clearLayers();
    $("vrijA").value = document.activeElement === $("vrijA") ? $("vrijA").value : llTxt(vrij.a);
    $("vrijB").value = document.activeElement === $("vrijB") ? $("vrijB").value : llTxt(vrij.b);
    $("vrijS").value = document.activeElement === $("vrijS") ? $("vrijS").value : vrij.s;
    $("vrijK").value = document.activeElement === $("vrijK") ? $("vrijK").value : vrij.k;
    $("vrijSkant").textContent = vrij.links ? "links" : "rechts";
    const uit = $("vrijUit"); uit.innerHTML = "";
    // Markers blijven staan (anders breekt het slepen af); tijdens het slepen rekent alles live mee
    [["A", vrij.a, "a"], ["B", vrij.b, "b"]].forEach(([t, c, k]) => {
      if (!vrijModus || !c) { if (vrijM[k]) { vrijLaag.removeLayer(vrijM[k]); delete vrijM[k]; } return; }
      if (!vrijM[k]) {
        const m = vrijM[k] = L.marker([c[1], c[0]], { draggable: true, icon: L.divIcon({ className: "", html: '<div class="abl vrijp">' + t + "</div>", iconSize: [26, 26] }) });
        m.on("dragstart", () => { m._sleept = true; });
        // Tik op A of B: dat punt kiezen, de volgende tik op de kaart zet het daar
        m.on("click", () => kies(k));
        m.on("drag", () => { const p = m.getLatLng(); vrij[k] = [p.lng, p.lat]; if (k === "a") zetAplus(); else vrij.k = ""; tekenVrij(); });
        m.on("dragend", () => { m._sleept = false; bewaarVrij(); tekenVrij(); });
        vrijLaag.addLayer(m);
      } else if (!vrijM[k]._sleept) vrijM[k].setLatLng([c[1], c[0]]);
    });
    if (!vrijModus) return;
    if (!vrij.a || !vrij.b) { uit.textContent = vrij.a ? "Tik B op de kaart." : "Tik A op de kaart."; return; }
    const k = Perceel.koers(vrij.a, vrij.b), gr = v => v.toLocaleString("nl-NL", { minimumFractionDigits: 4, maximumFractionDigits: 4 }) + "°";
    vrijLijn.addLayer(L.polyline([[vrij.a[1], vrij.a[0]], [vrij.b[1], vrij.b[0]]], { color: "#e8590c", weight: 3, interactive: false }));
    // Lijn doortrekken (zoals de GPS-kast hem oneindig doortrekt), om langs een rand of pad te controleren
    const v1 = Perceel.puntOpKoers(vrij.a, k.koers, 2000), v2 = Perceel.puntOpKoers(vrij.a, (k.koers + 180) % 360, 2000);
    vrijLijn.addLayer(L.polyline([[v2[1], v2[0]], [v1[1], v1[0]]], { color: "#e8590c", weight: 1.5, opacity: .8, dashArray: "8 6", interactive: false }));
    const sm = parse(vrij.s) || 0;
    let html = "<div class='kort'><div><span>Koers A → B</span><b>" + esc(gr(k.koers)) + "</b></div><div><span>Terug B → A</span><b>" + esc(gr((k.koers + 180) % 360)) + "</b></div>" +
      "<div><span>Afstand</span><b>" + esc(mDec(Math.round(k.afstand * 10) / 10)) + "</b></div></div>" +
      "<div class='ab'>A: " + esc(llTxt(vrij.a)) + "<br>B: " + esc(llTxt(vrij.b)) + "<br>Midden: " + esc(llTxt(k.midden)) + "</div>";
    if (sm) {
      const [a2, b2] = Perceel.verschuifLijn(vrij.a, vrij.b, vrij.links ? -sm : sm);
      vrijLijn.addLayer(L.polyline([[a2[1], a2[0]], [b2[1], b2[0]]], { color: "#e8590c", weight: 2, dashArray: "6 6", interactive: false }));
      html += "<div class='ab'><strong>" + esc(mDec(sm)) + " naar " + (vrij.links ? "links" : "rechts") + "</strong> (gezien van A naar B), zelfde koers:<br>A: " + esc(llTxt(a2)) + "<br>B: " + esc(llTxt(b2)) + "</div>";
    }
    // Controle: hoe ligt de lijn ten opzichte van de langste rechte kant van het perceel waar A in ligt
    const ob = objBijPunt(vrij.a);
    if (ob) {
      try {
        const ref = Perceel.sporen(ob.geom, 27, {});
        if (ref) {
          let dv = Math.abs(k.koers - ref.koers) % 180; if (dv > 90) dv = 180 - dv; // lijnen: richting maakt niet uit
          const opz = ref.abLengte * Math.tan(dv * Math.PI / 180);
          html += "<div class='ab'>Langste rechte kant van " + esc(ob.naam) + ": koers " + esc(gr(ref.koers)) + " / " + esc(gr((ref.koers + 180) % 360)) +
            "<br><strong>Verschil " + esc(dv.toLocaleString("nl-NL", { minimumFractionDigits: 3, maximumFractionDigits: 3 })) + "°</strong> = " + esc(mDec(Math.round(opz * 100) / 100)) + " op " + esc(mTxt(ref.abLengte)) + (dv < 0.05 ? " (loopt mee met de kant)" : dv < 0.5 ? "" : " (loopt niet evenwijdig met die kant)") + "</div>";
        }
      } catch (e) { /* geen vergelijking */ }
    }
    uit.innerHTML = html;
    // Gebruik deze lijn voor het perceel of de kavel waar A in (of bij) ligt: sporen en zaaiplan gaan erop
    const o = ob;
    if (o) {
      const bt = document.createElement("button"); bt.type = "button"; bt.className = "btn"; bt.style.marginTop = "10px"; bt.style.width = "100%";
      bt.textContent = "Gebruik als AB-lijn voor " + o.naam;
      bt.addEventListener("click", () => {
        // Nieuwe AB-lijn: de keuzes voor de startkant horen bij de oude
        o.obj.abLijn = [vrij.a.slice(), vrij.b.slice()]; delete o.obj.abPunt; delete o.obj.spuitAnders; delete o.obj.zaaiAnders; o.opslaan();
        setVrij(false); teken();
        say("AB-lijn van " + o.naam + " staat op deze lijn (telt als spuitpad; onder de spuituitleg om te zetten)." + (spuitAan || maisAan ? "" : " Zet Spuiten of Mais zaaien aan om de sporen te zien."));
      });
      uit.appendChild(bt);
    }
  }
  // Gekozen punt (a of b) na een tik op het blokje A of B; de volgende tik op de kaart zet het daar
  let vrijKies = null;
  const markeerKies = () => ["a", "b"].forEach(k => {
    const el = vrijM[k] && vrijM[k].getElement(), d = el && el.querySelector(".abl");
    if (d) d.classList.toggle("gekozen", vrijKies === k);
    $(k === "a" ? "kiesA" : "kiesB").setAttribute("aria-pressed", vrijKies === k);
  });
  const kies = k => { vrijKies = vrijKies === k ? null : k; markeerKies(); const t = k === "a" ? "A" : "B"; say(vrijKies ? t + " gekozen: tik op de kaart waar " + t + " moet komen." : t + " niet meer gekozen."); };
  $("kiesA").addEventListener("click", () => kies("a"));
  $("kiesB").addEventListener("click", () => kies("b"));
  function vrijTik(ll) {
    const c = [ll.lng, ll.lat];
    // A of B gekozen (knop A/B in het paneel of het blokje op de kaart): dat punt komt hier, ook als het ver weg stond
    if (vrijKies) {
      const k = vrijKies; vrij[k] = c; if (k === "a") zetAplus(); else vrij.k = "";
      vrijKies = null; bewaarVrij(); tekenVrij(); markeerKies(); say((k === "a" ? "A" : "B") + " staat nu hier.");
      return;
    }
    // A+ ingevuld: elke tik zet A, de lijn volgt de koers
    if (parse(vrij.k) != null) { vrij.a = c; zetAplus(); bewaarVrij(); tekenVrij(); return; }
    if (!vrij.a) vrij.a = c;
    else if (!vrij.b) vrij.b = c;
    else {
      // Allebei gezet: het dichtstbijzijnde punt verplaatsen
      const d = p => map.distance(ll, L.latLng(p[1], p[0]));
      if (d(vrij.a) <= d(vrij.b)) vrij.a = c; else vrij.b = c;
    }
    bewaarVrij(); tekenVrij();
  }
  function setVrij(aan) {
    if (aan) { if (oeverModus) setOever(false); if (koppelModus) setKoppel(false); if (abModus) setAB(false); }
    vrijModus = aan; vrijKies = null; markeerKies();
    $("bVrij").setAttribute("aria-pressed", aan);
    $("bVrij").textContent = aan ? "Klaar met AB-lijn" : "AB-lijn meten";
    $("vrijBox").hidden = !aan;
    $("map").classList.toggle("oever", aan);
    say(aan ? "Tik A en B op de kaart (of GPS / intikken). Daarna kun je ze slepen; een tik verplaatst het dichtstbijzijnde punt. Staat er een ver weg: tik op A of B hiernaast en dan op de kaart." : "Tik op een perceel om het toe te voegen. Nog eens tikken haalt het weg.");
    tekenVrij();
  }
  $("bVrij").addEventListener("click", () => setVrij(!vrijModus));
  // Typen: zodra het een geldige coördinaat is meteen meerekenen; bij verlaten van het veld de kaart erheen
  [["vrijA", "a"], ["vrijB", "b"]].forEach(([id, k]) => $(id).addEventListener("input", () => {
    const p = leesPunt($(id).value);
    if (p) { vrij[k] = p; if (k === "a") zetAplus(); else vrij.k = ""; bewaarVrij(); tekenVrij(); }
  }));
  [["vrijA", "a"], ["vrijB", "b"]].forEach(([id, k]) => $(id).addEventListener("change", () => {
    const p = leesPunt($(id).value);
    if ($(id).value.trim() && !p) { say("Coördinaat niet herkend. Bijvoorbeeld: 52.67786562, 5.20413689", true); return; }
    vrij[k] = p; bewaarVrij(); $(id).blur(); tekenVrij();
    if (p) map.panTo([p[1], p[0]]);
  }));
  $("vrijS").addEventListener("input", () => { vrij.s = $("vrijS").value; bewaarVrij(); tekenVrij(); });
  // A+: punt A plus een koers. B komt dan 500 m verder op die koers te liggen (zelfde rekenwijze als de GPS-kast)
  const zetAplus = () => {
    const g = parse(vrij.k);
    if (vrij.a && g != null && g >= 0 && g < 360) vrij.b = Perceel.puntOpKoers(vrij.a, g, 500);
  };
  $("vrijK").addEventListener("input", () => {
    vrij.k = $("vrijK").value; zetAplus(); bewaarVrij(); tekenVrij();
    if (vrij.k && !vrij.a) say("Zet eerst punt A (tikken, intikken of GPS); de lijn gaat met deze koers door A.");
  });
  $("vrijSkant").addEventListener("click", () => { vrij.links = !vrij.links; bewaarVrij(); tekenVrij(); });
  $("vrijWis").addEventListener("click", () => { vrij.a = vrij.b = null; vrij.k = ""; bewaarVrij(); tekenVrij(); });
  $("vrijOm").addEventListener("click", () => { [vrij.a, vrij.b] = [vrij.b, vrij.a]; vrij.k = ""; bewaarVrij(); tekenVrij(); });
  [["vrijAgps", "a"], ["vrijBgps", "b"]].forEach(([id, k]) => $(id).addEventListener("click", async e => {
    const btn = e.currentTarget; btn.disabled = true; btn.textContent = "…";
    try {
      const p = await Perceel.positie();
      vrij[k] = [p.lon, p.lat]; if (k === "a") zetAplus(); else vrij.k = ""; bewaarVrij(); tekenVrij(); map.panTo([p.lat, p.lon]);
      say((k === "a" ? "A" : "B") + " op je GPS-positie (nauwkeurig tot ca. " + Math.round(p.nauwkeurigheid || 0) + " m). Een telefoon is geen RTK: sleep het punt zo nodig nog goed.", (p.nauwkeurigheid || 0) > 5);
    } catch (er) { say(er.message, true); }
    finally { btn.disabled = false; btn.textContent = "GPS"; }
  }));

  $("bMij").addEventListener("click", async e => {
    const btn = e.currentTarget, old = btn.textContent;
    btn.disabled = true; btn.textContent = "Locatie zoeken…";
    try {
      const p = await Perceel.positie();
      if (!inNL(p.lat, p.lon)) { say("Je locatie ligt buiten Nederland; daar heeft PDOK geen kaart of percelen.", true); return; }
      if (mij) mij.remove();
      mij = L.marker([p.lat, p.lon], { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [22, 22] }), interactive: false }).addTo(map);
      map.setView([p.lat, p.lon], 16);
      say("Tik op een perceel op de kaart.");
    } catch (er) { say(er.message, true); }
    finally { btn.disabled = false; btn.textContent = old; }
  });
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
